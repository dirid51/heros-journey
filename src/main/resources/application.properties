spring.application.name=heros-journey

# Ollama settings
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.model=granite4.1:3b
spring.ai.ollama.chat.options.temperature=0.7

# Security: SameSite cookie attribute for CSRF protection

# Show DEBUG logs for your own code, INFO for everything else
logging.level.org.bhp.heros_journey=DEBUG
logging.level.root=INFO

# Show full stack traces (this is the default but explicit is better)
logging.exception-conversion-word=%wEx