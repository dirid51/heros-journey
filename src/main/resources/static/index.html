<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Procedural RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading-screen">
    <div id="loading-content">
        <div id="loading-spinner">⠋</div>
        <p id="loading-text">The world is taking shape...</p>
    </div>
</div>
<div id="game-container">
    <aside id="stats-panel">
        <!-- TODO: MAP - Add a map panel (canvas or SVG) rendering the visited room graph as a node/edge diagram -->
        <h2>Player Stats</h2>
        <div class="stat">Health: <span id="hp-val">100</span> / <span id="max-hp-val">100</span></div>
        <div class="stat">Injury Reduction: <span id="ir-val">0</span>%</div>
        <h3>Skills</h3>
        <ul id="skills-list"></ul>
        <h3>Inventory</h3>
        <ul id="inventory-list">
            <li class="empty-inventory">— empty —</li>
        </ul>
    </aside>

    <main id="main-area">
        <div id="history-log">
            <p>Welcome to the void. Type a command to begin your journey.</p>
        </div>
        <div id="input-area">
            <span>&gt; </span>
            <input type="text" id="user-input" autofocus placeholder="Type an action or direction...">
            <span id="spinner" class="spinner hidden">⠋</span>
        </div>
    </main>
</div>
<script src="game.js"></script>
</body>
</html>
